<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Course - Skill Bridge</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <h1>🌉 Skill Bridge</h1>
        <div>
            <a href="/teacher">Teacher Panel</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="form-container">
        <h2>✏️ Edit Course</h2>
        <p>Update the course details below!</p>

        <form method="POST" action="/teacher/edit_course/{{ course[0] }}">
            <div class="form-group">
                <label>Course Title</label>
                <input type="text" name="title" 
                       value="{{ course[1] }}" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" 
                       value="{{ course[2] }}" required>
            </div>
            <button type="submit" class="btn">Save Changes</button>
            <a href="/teacher" class="btn-unenroll" 
               style="margin-left:1rem;">Cancel</a>
        </form>
    </div>
</body>
</html>
